name: Validate dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/core.test.mjs scripts/public-build.test.mjs scripts/tikina.test.mjs
      - run: node scripts/validate.mjs
